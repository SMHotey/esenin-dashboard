<svg class="desk-art" viewBox="0 0 960 600" role="img" aria-labelledby="desk-art-title" xmlns="http://www.w3.org/2000/svg">
  <title id="desk-art-title">Письменный стол и стул начала XX века: чернильница с пером, исписанный лист с пометкой 404 и чистые листы</title>

  <!-- пол и тени -->
  <ellipse class="d-shadow" cx="390" cy="548" rx="285" ry="18"/>
  <ellipse class="d-shadow" cx="812" cy="524" rx="112" ry="14"/>

  <!-- стол: боковина и передняя панель -->
  <polygon class="d-wood-dark" points="100,300 175,405 175,448 100,343"/>
  <polygon class="d-wood" points="175,405 665,355 665,398 175,448"/>
  <polygon class="d-wood-light" points="100,300 590,255 665,355 175,405"/>

  <!-- прожилки на столешнице -->
  <g class="d-grain">
    <path d="M118,309 C230,290 420,268 578,262"/>
    <path d="M132,322 C250,303 430,281 596,274"/>
    <path d="M150,336 C270,317 450,294 612,286"/>
    <path d="M166,350 C290,331 470,307 630,299"/>
  </g>

  <!-- ящик и ручки -->
  <polygon class="d-panel" points="392,392 560,374 560,404 392,423"/>
  <polygon class="d-panel" points="580,372 636,366 636,396 580,402"/>
  <circle class="d-brass" cx="470" cy="398" r="7"/>
  <circle class="d-brass" cx="610" cy="384" r="5"/>

  <!-- ножки стола -->
  <polygon class="d-wood-dark" points="204,442 229,439 222,546 207,546"/>
  <polygon class="d-wood-dark" points="604,394 629,391 636,506 621,506"/>
  <g class="d-grain">
    <path d="M212,462 L216,530"/>
    <path d="M613,414 L618,490"/>
  </g>

  <!-- стопка книг на дальнем краю -->
  <g transform="translate(152,291) skewY(-6)">
    <rect class="d-book-2" x="0" y="-2" width="126" height="14" rx="2"/>
    <rect class="d-book-1" x="3" y="-17" width="120" height="14" rx="2"/>
    <rect class="d-book-3" x="0" y="-31" width="124" height="13" rx="2"/>
    <path class="d-gold" d="M14,-12 H48 M14,4 H40 M12,-26 H52"/>
  </g>

  <!-- бювар и исписанный лист -->
  <g transform="translate(212,330) skewY(-6)">
    <rect class="d-blotter" x="0" y="0" width="258" height="76" rx="5"/>
    <rect class="d-paper-shade" x="18" y="-16" width="214" height="68" rx="3"/>
    <rect class="d-paper" x="15" y="-20" width="214" height="68" rx="3"/>
    <path class="d-rule" d="M15,-20 H229"/>

    <!-- рукописные строки -->
    <g class="d-hand">
      <path d="M28,-10 q7,-3 14,0 t14,0 t14,0 t14,0 t14,0 t14,0"/>
      <path d="M28,-2 q7,-3 14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0"/>
      <path d="M28,6 q7,-3 14,0 t14,0 t14,0 t14,0 t14,0"/>
      <path d="M28,22 q7,-3 14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0"/>
      <path d="M28,30 q7,-3 14,0 t14,0 t14,0 t14,0 t14,0 t14,0"/>
      <path d="M28,38 q7,-3 14,0 t14,0 t14,0 t14,0"/>
    </g>

    <!-- рукописный 404 -->
    <text class="d-num" x="140" y="12">404</text>
    <path class="d-hand" d="M139,19 q9,-4 18,0 t18,0 t18,0"/>
  </g>

  <!-- чистые листы справа -->
  <g transform="translate(505,318) skewY(-6)">
    <rect class="d-paper-shade" x="-8" y="-14" width="152" height="62" rx="3" transform="rotate(-2 68 17)"/>
    <rect class="d-paper-shade" x="-2" y="-8" width="152" height="62" rx="3" transform="rotate(2 75 23)"/>
    <rect class="d-paper" x="0" y="0" width="150" height="62" rx="3"/>
    <path class="d-rule" d="M0,0 H150"/>
  </g>

  <!-- чернильница с пером -->
  <g>
    <ellipse class="d-shadow" cx="430" cy="290" rx="36" ry="9"/>
    <path class="d-glass" d="M405,252 H457 L452,284 Q430,295 409,284 Z"/>
    <path class="d-ink" d="M412,271 H450 L448,283 Q430,291 414,283 Z"/>
    <path class="d-glass-hl" d="M412,258 V279"/>
    <rect class="d-brass" x="401" y="243" width="60" height="10" rx="3"/>
    <ellipse class="d-brass" cx="431" cy="242" rx="32" ry="9"/>
    <circle class="d-brass-dark" cx="431" cy="232" r="4.5"/>

    <!-- перо -->
    <path class="d-quill" d="M433,238 C 470,198 520,160 602,118"/>
    <path class="d-feather" d="M470,196 C 500,150 548,116 616,102 C 606,144 560,186 498,208 Z"/>
    <path class="d-quill-thin" d="M500,205 C 530,166 566,136 610,108"/>
    <g class="d-barb">
      <path d="M486,196 L500,176"/>
      <path d="M500,186 L516,164"/>
      <path d="M514,175 L532,152"/>
      <path d="M528,164 L546,142"/>
      <path d="M542,152 L560,132"/>
      <path d="M556,141 L574,122"/>
      <path d="M522,184 L534,200"/>
      <path d="M544,167 L556,183"/>
      <path d="M566,150 L578,164"/>
    </g>
    <path class="d-ink" d="M430,240 l6,16 l-7,-2 l-5,2 Z"/>
  </g>

  <!-- стул -->
  <g>
    <path class="d-wood-dark" d="M842,354 L850,472 M884,358 L892,478" stroke-width="6"/>
    <path class="d-wood-dark" d="M726,418 L716,520 M872,400 L884,512" stroke-width="7"/>
    <path class="d-wood" d="M730,470 L876,452" stroke-width="7"/>

    <path class="d-wood-dark" d="M844,346 C 846,290 850,236 856,198" stroke-width="10"/>
    <path class="d-wood-dark" d="M884,350 C 888,294 894,240 898,204" stroke-width="10"/>
    <path class="d-wood-light" d="M852,202 Q 876,180 900,206" stroke-width="12"/>

    <g class="d-spindles">
      <path d="M860,208 L858,346"/>
      <path d="M870,204 L869,344"/>
      <path d="M880,205 L882,345"/>
      <path d="M890,208 L891,347"/>
    </g>

    <path class="d-wood" d="M712,368 L862,348 L892,392 L742,414 Z"/>
    <path class="d-wood-light" d="M712,368 L742,414 L742,424 L712,378 Z"/>
    <path class="d-cushion" d="M724,362 L852,346 L874,381 L746,400 Z"/>
    <path class="d-wood-dark" d="M742,410 L876,392 L876,402 L742,421 Z"/>
  </g>
</svg>
